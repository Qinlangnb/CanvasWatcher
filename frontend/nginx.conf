server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Bounded multi-round AI requests can outlast nginx's default 60 seconds.
  location /api/ai/chat { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_read_timeout 1500s; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  # The public deployment may mount this app at a path such as /watcher. Strip
  # that path before forwarding API requests; root-path development remains valid.
  location ~ ^/(?:[^/]+/)*api/ai/chat(?:/|$) {
    rewrite ^/(?:[^/]+/)*(api/ai/chat.*)$ /$1 break;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 1500s;
  }
  location ~ ^/(?:[^/]+/)*api/ {
    rewrite ^/(?:[^/]+/)*(api/.*)$ /$1 break;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  # Vite emits built assets under assets/ while prefixing their public URLs.
  location ~ ^/(?:[^/]+/)*assets/(.*)$ {
    alias /usr/share/nginx/html/assets/$1;
  }
  location / { try_files $uri /index.html; }
}
