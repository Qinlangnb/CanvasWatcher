[project]
name = "academic-watcher"
version = "0.7.1"
description = "Local Canvas and course-site monitor with deterministic study planning"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "icalendar>=6,<7",
  "lxml>=5,<7",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.18,<1",
  "recurring-ical-events>=3,<4",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "requests-ntlm>=1.3,<2",
  "sqlalchemy>=2.0,<3",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.49,<2"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = [".", "../auth-broker"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
