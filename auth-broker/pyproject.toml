[project]
name = "academic-watcher-auth-broker"
version = "0.7.0"
description = "Loopback-only host authentication broker for Academic Watcher"
license = "GPL-2.0-only"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.32,<1", "playwright>=1.49,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["academic_watcher_auth_broker"]
